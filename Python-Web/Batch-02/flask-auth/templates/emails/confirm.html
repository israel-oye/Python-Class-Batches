<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: rgb(1, 1, 37);
        }
    </style>
</head>

<body>
    <h3>Welcome to Our App</h3>

    <p>
        We're pleased to have you here, {{name}}.

        Visit <a href="{{url_for('auth.confirm_email', token=confirm_token, _external=True)}}">this link</a> to verify your account.
    </p>
</body>

</html>
